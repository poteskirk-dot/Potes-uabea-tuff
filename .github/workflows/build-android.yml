name: Build UABEA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Restore project
        run: dotnet restore UABEAAndroid/UABEAAndroid.csproj

      - name: Build APK
        run: |
          dotnet publish UABEAAndroid/UABEAAndroid.csproj \
            -c Release \
            -f net6.0-android31.0 \
            -p:AndroidPackageFormat=apk \
            -p:AndroidUseLatestPlatformSdk=true

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find UABEAAndroid/bin/Release -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Android-APK
          path: UABEAAndroid/bin/Release/net6.0-android31.0/publish/*.apk
