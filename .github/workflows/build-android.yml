name: Build UABEA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore
        run: dotnet restore UABEAAndroid/UABEAAndroid.csproj

      - name: Build APK
        run: |
          dotnet publish UABEAAndroid/UABEAAndroid.csproj \
            -c Release \
            -f net6.0-android31.0 \
            -p:AndroidPackageFormat=apk \
            -p:AndroidUseLatestPlatformSdk=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Android-APK
          path: UABEAAndroid/bin/Release/net6.0-android31.0/publish/*.apk
