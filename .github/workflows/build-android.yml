name: Build UABEA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 34
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Restore
        run: dotnet restore UABEAAndroid.csproj

      - name: Build APK
        run: |
          dotnet publish UABEAAndroid.csproj \
            -c Release \
            -f net6.0-android31.0 \
            -p:AndroidPackageFormat=apk \
            -p:AndroidUseLatestPlatformSdk=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Android-APK
          path: bin/Release/net6.0-android31.0/publish/*.apk
